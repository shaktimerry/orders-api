apiVersion: v1
kind: LimitRange

metadata:
  name: orders-api-limits
  namespace: orders-prod

spec:

  limits:

  - type: Container

    default:

      cpu: "1"
      memory: "1Gi"

    defaultRequest:

      cpu: "250m"
      memory: "512Mi"

    min:

      cpu: "100m"
      memory: "128Mi"

    max:

      cpu: "2"
      memory: "4Gi"
