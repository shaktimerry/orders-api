kind: ServiceAccount
metadata:
  name: orders-api-sa
  namespace: orders-prod
  annotations:
    azure.workload.identity/client-id: "<UAMI-CLIENT-ID>"

    //The actual client ID should not be hardcoded separately for every environment. 
    Kustomize/Helm/Terraform/Azure DevOps normally injects environment-specific values.
Workload Identity is the current Azure approach for Pod → Azure authentication;//
